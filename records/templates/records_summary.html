{% extends "admin/base_site.html" %}

{% block content %}
<p><strong>Total Uploaded Files:</strong> {{ total_uploaded }}</p>
<p><strong>Total Cropped Images:</strong> {{ total_cropped }}</p>

<h2>Class Distribution</h2>
<div style="display: flex; justify-content: center; align-items: center; height: 400px; width: 100%;">
    <canvas id="classChart" width="200" height="200"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const labels = [
        {% for row in class_counts %}
    "{{ row.originalLabel|default:'Unlabeled' }}"{% if not forloop.last %}, {% endif %}
    {% endfor %}
    ];

    const data = {
        labels: labels,
        datasets: [{
            label: 'Number of Class',
            data: [
                {% for row in class_counts %}
                    {{ row.count }}{% if not forloop.last %}, {% endif %}
    {% endfor %}
            ],
    backgroundColor: 'rgba(10, 50, 110, 0.6)',
        borderColor: 'rgba(10, 50, 110, 1)',
            borderWidth: 1
        }]
    };

    const config = {
        type: 'bar',
        data: data,
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { precision: 0 }
                }
            }
        }
    };

    const classChart = new Chart(
        document.getElementById('classChart'),
        config
    );
</script>
{% endblock %}
